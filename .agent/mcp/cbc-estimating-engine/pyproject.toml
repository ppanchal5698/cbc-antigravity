[project]
name = "cbc-estimating-engine"
version = "0.1.0"
description = "Deterministic commercial estimating and pricing engine MCP server for CBC"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
]

[project.scripts]
cbc-estimating-engine = "cbc_engine.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cbc_engine"]
