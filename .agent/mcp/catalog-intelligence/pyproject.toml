[project]
name = "catalog-intelligence"
version = "0.1.0"
description = "MCP server that turns vendor price books into a queryable, CSI-tagged product index"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    # AGPL-3.0 (or Artifex commercial). See README before redistributing.
    "pymupdf>=1.24",
    # .xlsx price lists: World Dryer's whole book, Gamco's distributor list and
    # Hamilton Parker's net-cost sheets are spreadsheets, not PDFs.
    "openpyxl>=3.1",
]

[project.scripts]
catalog-intelligence = "catint.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["catint"]
