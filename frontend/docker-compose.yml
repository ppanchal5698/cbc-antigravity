name: cbc-copilot

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cbc}
      # No default. This used to fall back to `cbc`, which shipped a known
      # password on a published port; compose now refuses to start without one.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - there is no default}
      POSTGRES_DB: ${POSTGRES_DB:-cbc}
    ports:
      # 5432 on the host is usually taken by a native PostgreSQL install.
      - "${BIND_ADDR:-127.0.0.1}:${DB_HOST_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18+ images want the mount one level up, at
      # /var/lib/postgresql, so data lands in a version-named subdirectory.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cbc} -d ${POSTGRES_DB:-cbc}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The long-lived Antigravity connection: SSE gateway + document worker.
  # agy is always launched with cwd=/workspace.
  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cbc}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - there is no default}@db:5432/${POSTGRES_DB:-cbc}
      WORKSPACE_ROOT: /workspace
      SEED_ROOT: /seed
      AGY_BIN: agy
      AGY_MODEL: ${AGY_MODEL:-}
      AGY_EFFORT: ${AGY_EFFORT:-}
      AGY_TIMEOUT: ${AGY_TIMEOUT:-30m}
      AGENT_PORT: 8787
      # Required whenever BIND_ADDR reaches beyond loopback; the gateway refuses to
      # start without it rather than listening unauthenticated on a network.
      BIND_ADDR: ${BIND_ADDR:-127.0.0.1}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      KEYRING_PASSWORD: ${KEYRING_PASSWORD:-}
      # Email intake. Off unless INTAKE_ENABLED is set; see .env.example for the
      # warning that goes with switching it on.
      INTAKE_ENABLED: ${INTAKE_ENABLED:-0}
      IMAP_HOST: ${IMAP_HOST:-imap.gmail.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      INTAKE_ALLOWED_SENDERS: ${INTAKE_ALLOWED_SENDERS:-}
      INTAKE_POLL_MS: ${INTAKE_POLL_MS:-60000}
      INTAKE_MAX_PER_CYCLE: ${INTAKE_MAX_PER_CYCLE:-5}
      INTAKE_MAX_PER_SENDER_PER_DAY: ${INTAKE_MAX_PER_SENDER_PER_DAY:-20}
      INTAKE_MAX_PENDING_RUNS: ${INTAKE_MAX_PENDING_RUNS:-25}
      INTAKE_PLAN_CHECK_TIMEOUT_MS: ${INTAKE_PLAN_CHECK_TIMEOUT_MS:-120000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
    volumes:
      # The host CBC workspace, read-only. Seeds the volume on first boot and is
      # never written to, so the Antigravity IDE's Windows paths stay intact.
      - ${CBC_WORKSPACE_HOST:-..}:/seed:ro
      - workspace:/workspace
      # agy's OAuth credentials and keyring; survives restarts after one login.
      - agy-home:/root
    ports:
      # Loopback by default. POST /chat on this port spawns agy with
      # --dangerously-skip-permissions, read-write on the whole workspace, and
      # nothing here authenticates - the domain gate is a SCOPE classifier, not
      # an access control. Published on 0.0.0.0 it handed agent execution to
      # anyone on the network. See "Exposure" in README.md before changing
      # BIND_ADDR.
      - "${BIND_ADDR:-127.0.0.1}:${AGENT_HOST_PORT:-8787}:8787"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cbc}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - there is no default}@db:5432/${POSTGRES_DB:-cbc}
      AGENT_URL: http://agent:8787
      # The web app is the only authorised client; it proxies with this token.
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-}
      WORKSPACE_ROOT: /workspace
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
    volumes:
      # Uploads are written straight into the project folder the agent reads.
      - workspace:/workspace
    ports:
      # Loopback by default, like the agent. The UI has no login: whoever reaches
      # it can approve a draft, download a quote and start an estimate.
      - "${BIND_ADDR:-127.0.0.1}:${WEB_HOST_PORT:-3000}:3000"

  # Periodic snapshot of the workspace volume. The agent writes into the
  # workspace, so this is the undo button for a bad run.
  backup:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      - agent
    environment:
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      BACKUP_KEEP: ${BACKUP_KEEP:-24}
    volumes:
      - workspace:/workspace:ro
      # Defaults inside the checkout, where it is gitignored but still ~600 MB that every
      # tree walk and grep pays for. BACKUP_DIR moves it out without editing this file.
      - ${BACKUP_DIR:-./backups}:/backups
    # Folded scalar: every line is indented the same, otherwise YAML keeps the
    # newlines and `sh` sees a line starting with `&&`.
    #
    # .agent/cache holds the two SQLite indexes, which an MCP server may be writing
    # while this runs - a tar of a half-written database restores as a corrupt one.
    # They are excluded and rebuild on demand from the PDFs, which ARE in the archive,
    # so nothing unrecoverable is dropped. Excluding them also keeps the snapshot small
    # enough that BACKUP_KEEP hourly copies is affordable.
    command: >
      sh -c 'while true; do
      stamp=$$(date -u +%Y%m%dT%H%M%SZ);
      if tar czf "/backups/workspace-$$stamp.tar.gz"
      --exclude="./.agent/cache" --exclude="./.venv" -C /workspace . 2>/dev/null; then
      echo "[backup] wrote workspace-$$stamp.tar.gz";
      else echo "[backup] snapshot failed"; fi;
      ls -1t /backups/workspace-*.tar.gz 2>/dev/null | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm -f;
      sleep "$$BACKUP_INTERVAL_SECONDS";
      done'

volumes:
  pgdata:
  workspace:
  agy-home:
